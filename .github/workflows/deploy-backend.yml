# 백엔드: supabase/ 변경을 main에 push하면 Supabase에 DB 마이그레이션과 Edge Functions를 배포
# 필요 시크릿 (저장소 Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN  : https://supabase.com/dashboard/account/tokens 에서 발급
#   SUPABASE_DB_PASSWORD   : 프로젝트 DB 비밀번호 (마이그레이션 push 용)
name: Deploy backend (Supabase)

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

env:
  PROJECT_REF: ivyhmwpbpkfvbwnckqgv
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "SUPABASE_ACCESS_TOKEN 시크릿이 없어 배포를 건너뜁니다." >> $GITHUB_STEP_SUMMARY
            echo "ok=false" >> $GITHUB_OUTPUT
          else
            echo "ok=true" >> $GITHUB_OUTPUT
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest
      - name: Push database migrations
        if: steps.check.outputs.ok == 'true' && env.SUPABASE_DB_PASSWORD != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Deploy edge functions
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in signup chat game payments; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
